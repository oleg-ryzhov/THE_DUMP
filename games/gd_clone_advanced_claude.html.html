  else if(k==1){const a=Math.max(1,Math.round(1.4*s));add('p',x,0,1,.3,{c:'y'});sp(x+a,0);sp(x+a+1,0);x+=a+2+r(2)}

function gball(x,e,d,s,R,add,sp){

function gtun(x,e,d,s,R,add,sp,gm,mg,sl,spk){

// wave: broken-line passage of 45-degree segments (band of vertical thickness g around a centre line)

// ---------- state ----------
let W,H,S,oy,hold=0,state='ui',cur=0,LVD=null,att=0,ptc=[],acc=0,lt=0,gm=0,P={x:0,y:.5,vy:0,g:1,m:0,si:1,on:1,dash:0,pt:9,rot:0,dead:0,dd:0,tr:[],win:0};
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;W=cv.width;H=cv.height;S=Math.min(H/12,W/17);oy=(H-12*S)/2}
function reset(){LVD.O.forEach(o=>o.u=0);P={x:0,y:.5,vy:0,g:1,m:0,si:1,on:1,dash:0,pt:9,rot:0,dead:0,dd:0,tr:[],win:0};att++;acc=0}
function die(){if(P.dead)return;P.dead=1;P.dd=0;const pc=Math.min(99,P.x/LVD.end*100|0);if(pc>(sv.bs[cur]|0)){sv.bs[cur]=pc;save()}

function step(dt){
 const p=P,m=p.m,hz=[.5,.4,.45,.4,.15][m],hk=[.3,.25,.3,.25,.1][m],O=LVD.O;
 let g=p.g;const sp=SP[p.si]*(p.dash>0?1.4:1),tap=p.pt<.08;

  if(o.x>p.x+1)break;

 else if(m==0){p.vy-=g*90*dt;if(p.on&&hold){p.vy=g*19;p.on=0}}
 else if(m==1)p.vy=cl(p.vy+(hold?50:-38)*g*dt,-11,11);
 else if(m==2){p.vy-=g*72*dt;if(p.on&&tap){p.g=g=-g;p.vy=-g*4;p.pt=9;p.on=0}}
 else if(m==3){p.vy-=g*55*dt;if(tap){p.vy=g*11.5;p.pt=9}}

 if(m!=1&&m!=4)p.vy=cl(p.vy,-26,26);

 if(p.y+hz>10){p.y=10-hz;if(p.vy>0)p.vy=0;if(g<0)p.on=1}
 if(m==0){if(p.on)p.rot+=(Math.round(p.rot/1.5708)*1.5708-p.rot)*Math.min(1,dt*30);else p.rot+=g*7.5*dt}else if(m==2)p.rot+=g*sp*dt*1.8;

  if(t=='z'){if(m==4&&p.x>=o.x&&p.x<=o.x+o.w){const gp=o.g0+(o.g1-o.g0)*(p.x-o.x)/o.w,yc=o.ya+o.dir*(p.x-o.x);if(p.y-hz<yc-gp/2||p.y+hz>yc+gp/2)return die()}continue}
  if(t=='s'){if(Math.abs(p.x-o.x-.5)<.17+hk&&(o.f?p.y+hk>o.y+.45&&p.y-hk<o.y+1:p.y+hk>o.y&&p.y-hk<o.y+.55))return die()}
  else if(o.u)continue;
  else if(t=='o'){if(tap&&Math.abs(p.x-o.x-.5)<.85&&Math.abs(p.y-o.y-.5)<.85){o.u=1;p.pt=9;p.on=0;

  else if(t=='p'){if(Math.abs(p.x-o.x-.5)<.5+hz&&p.y-hz<o.y+.4&&p.y+hz>o.y&&p.g>0){o.u=1;p.on=0;
    if(PJ[o.c])p.vy=p.g*PJ[o.c];else{p.g=-p.g;p.vy=-p.g*6}}}
  else if(t=='e'){if(p.x>o.x){o.u=1;p.win=1;p.dd=0;sv.bs[cur]=100;save()}}

}

// ---------- rendering ----------
function draw(){
 const r=X,tm=performance.now()/1000;r.setTransform(1,0,0,1,0,0);
 const hu=LVD?LV[cur][1]:(tm*20)%360,vw=W/S,cam=LVD?P.x-vw*.3:tm*9,wx=x=>(x-cam)*S,wy=y=>oy+(10.5-y)*S,lw=Math.max(1.5,S*.05);
 const gr=r.createLinearGradient(0,0,0,H);gr.addColorStop(0,`hsl(${hu},65%,32%)`);gr.addColorStop(1,`hsl(${hu},70%,12%)`);r.fillStyle=gr;r.fillRect(0,0,W,H);
 const sh=cam*.4,k0=Math.floor(sh/6);r.fillStyle=`hsla(${hu},70%,60%,.1)`;
 for(let i=0;i<vw/6+3;i++){const n=((k0+i)*2654435761)>>>0,bh=2+n%6;r.fillRect((i*6-((sh%6)+6)%6)*S,wy(bh),2.4*S,H)}
 const y0=wy(0);r.fillStyle=`hsl(${hu},50%,12%)`;r.fillRect(0,y0,W,H);r.fillStyle=`hsl(${hu},90%,60%)`;r.fillRect(0,y0,W,lw*1.5);
 if(!LVD||P.m||P.g<0){const y1=wy(10);r.fillStyle=`hsl(${hu},50%,12%)`;r.fillRect(0,0,W,y1);r.fillStyle=`hsl(${hu},90%,60%)`;r.fillRect(0,y1-lw*1.5,W,lw*1.5)}
 const pf=[],ptl=(o,f)=>{const t=o.t,cx=wx(o.cx),cy=wy(o.cy);r.lineCap=r.lineJoin='round';
  if(t=='v'){const n=Math.max(1,o.i),ry=Math.min(o.r,1.6)*S,w=.7*S,x0=cx-n*w/2,col=['#4f8','#4f8','#fb2','#f84','#f44'][o.i];
   r.strokeStyle=col;r.lineWidth=S*.16;r.globalAlpha=f?1:.4;r.shadowColor=col;r.shadowBlur=f?S*.3:0;
   for(let i=0;i<n;i++){const a=x0+i*w+w*.15+(f?w*.12:-w*.12);r.beginPath();r.moveTo(a,cy-ry);r.lineTo(a+w*.6,cy);r.lineTo(a,cy+ry);r.stroke()}
   r.shadowBlur=0;r.globalAlpha=1;return}
  const col=t=='m'?MC[o.m]:o.g>0?'#fd3':'#3af',rx=S*.4,ry=o.r*S;r.strokeStyle=col;r.fillStyle=col;
  if(!f){r.globalAlpha=.16;r.beginPath();r.ellipse(cx,cy,rx,ry,0,0,7);r.fill();
   r.globalAlpha=.3;r.lineWidth=S*.08;r.beginPath();r.ellipse(cx+S*.12,cy,rx*.55,ry*.8,0,0,7);r.stroke();
   r.globalAlpha=.5;r.lineWidth=S*.12;r.beginPath();r.ellipse(cx,cy,rx,ry,0,Math.PI/2,Math.PI*1.5);r.stroke();
   r.globalAlpha=.8;r.font=`700 ${S*.6}px system-ui`;r.textAlign='center';
   r.fillText(t=='m'?MN[o.m][0].toUpperCase():o.g>0?'\u2193':'\u2191',cx,cy+S*.22)}
  else{r.globalAlpha=1;r.lineWidth=S*.16;r.shadowColor=col;r.shadowBlur=S*.35;r.beginPath();r.ellipse(cx,cy,rx,ry,0,-Math.PI/2,Math.PI/2);r.stroke();r.shadowBlur=0}
  r.globalAlpha=1};
 if(LVD){const O=LVD.O;
  for(let i=lb(cam-34);i<O.length;i++){const o=O[i];
   if(o.x>cam+vw+1)break;if(o.x+o.w<cam-1)continue;
   const t=o.t,sx=wx(o.x);r.lineWidth=lw;
   if(t=='b'){r.fillStyle=`hsl(${hu},45%,7%)`;r.fillRect(sx,wy(o.y+o.h),o.w*S,o.h*S);r.strokeStyle=`hsl(${hu},90%,65%)`;r.beginPath();
    for(let cx=Math.max(0,Math.floor(cam-o.x));cx<Math.min(o.w,vw+cam-o.x+1);cx++)for(let cy=0;cy<o.h;cy++){const ch=Math.min(1,o.h-cy);r.rect(sx+cx*S,wy(o.y+cy+ch),S,ch*S)}
    r.stroke()}
   else if(t=='s'){r.fillStyle='#000';r.strokeStyle=`hsl(${hu},95%,70%)`;r.beginPath();
    if(o.f){r.moveTo(sx,wy(o.y+1));r.lineTo(sx+S/2,wy(o.y));r.lineTo(sx+S,wy(o.y+1))}else{r.moveTo(sx,wy(o.y));r.lineTo(sx+S/2,wy(o.y+1));r.lineTo(sx+S,wy(o.y))}
    r.closePath();r.fill();r.stroke()}
   else if(t=='o'){const cx=sx+S/2,cy=wy(o.y+.5),c=OC[o.c];r.fillStyle=c;r.globalAlpha=.45;r.beginPath();r.arc(cx,cy,S*.3,0,7);r.fill();r.globalAlpha=1;r.strokeStyle=c;r.lineWidth=S*.08;r.beginPath();r.arc(cx,cy,S*.45,0,7);r.stroke()}
   else if(t=='p'){r.fillStyle=OC[o.c];r.beginPath();r.ellipse(sx+S/2,wy(o.y),S*.45,S*.22,0,Math.PI,0);r.fill()}
   else if(t=='z'){const xa=wx(o.x),xb=wx(o.x+o.w),yb=o.ya+o.dir*o.w,f0=wy(o.ya-o.g0/2),f1=wy(yb-o.g1/2),c0=wy(o.ya+o.g0/2),c1=wy(yb+o.g1/2);
    r.fillStyle=`hsl(${hu},45%,7%)`;r.beginPath();r.moveTo(xa,f0);r.lineTo(xb,f1);r.lineTo(xb,H);r.lineTo(xa,H);r.fill();r.beginPath();r.moveTo(xa,c0);r.lineTo(xb,c1);r.lineTo(xb,0);r.lineTo(xa,0);r.fill();
    r.strokeStyle=`hsl(${hu},90%,65%)`;r.lineWidth=lw*1.6;r.beginPath();r.moveTo(xa,f0);r.lineTo(xb,f1);r.moveTo(xa,c0);r.lineTo(xb,c1);r.stroke()}
   else if(t=='d'){r.fillStyle=`hsla(${hu},100%,70%,.15)`;r.beginPath();r.arc(sx,wy(o.y),o.r*S,0,7);r.fill()}
   else if(t=='e'){r.fillStyle='#fff';r.globalAlpha=.3;r.fillRect(sx,0,S,H);r.globalAlpha=1}
   else{ptl(o,0);pf.push(o)}}
  if(!P.dead){const px=wx(P.x),py=wy(P.y),m=P.m,sp=SP[P.si];
   if(m==4&&P.tr.length>1){r.strokeStyle=hsl(sv.c1);r.lineWidth=S*.28;r.globalAlpha=.7;r.beginPath();P.tr.forEach((q,i)=>i?r.lineTo(wx(q[0]),wy(q[1])):r.moveTo(wx(q[0]),wy(q[1])));r.stroke();r.globalAlpha=1}
   r.save();r.translate(px,py);
   if(m==4)r.rotate(-Math.atan2(P.vy,sp));else if(m==1){r.rotate(-Math.atan2(P.vy,sp)*.6);r.scale(1,P.g)}else if(m==3)r.scale(1,P.g);else r.rotate(P.rot);
   skin(r,m,sv.sk[m],hsl(sv.c1),hsl(sv.c2),S*(m==1||m==3?.95:m==4?.8:1));r.restore()}
  pf.forEach(o=>ptl(o,1));
  const pc=cl(P.x/LVD.end,0,1);r.fillStyle='#0008';r.fillRect(W*.25,10,W*.5,10);r.fillStyle='#3f6';r.fillRect(W*.25,10,W*.5*pc,10);
  r.fillStyle='#fff';r.font=`700 ${S*.45}px system-ui`;r.textAlign='center';r.fillText(`${pc*100|0}%   Attempt ${att}`,W/2,S*.8+14)}
 ptc.forEach(q=>{r.fillStyle=q.c;r.globalAlpha=cl(q.l*2,0,1);r.fillRect(wx(q.x)-S*.12,wy(q.y)-S*.12,S*.24,S*.24)});r.globalAlpha=1}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-lt)/1000||0);lt=t;
 if(state=='play'&&LVD){
  if(P.dead){P.dd+=dt;if(P.dd>.8)reset()}
  else if(P.win){P.dd+=dt;if(P.dd>1)done()}
  else{acc+=dt;while(acc>=1/240&&!P.dead&&!P.win){step(1/240);acc-=1/240}
   if(!P.dead&&P.m==4){P.tr.push([P.x,P.y]);if(P.tr.length>30)P.tr.shift()}else if(P.m!=4)P.tr=[]}}
 ptc.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=30*dt;q.l-=dt});ptc=ptc.filter(q=>q.l>0);draw()}
// ---------- input ----------
const dn=()=>{hold=1;P.pt=0},up=()=>{hold=0},KS=['Space','ArrowUp','KeyW'];
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(state=='play')dn()});
addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(KS.includes(e.code)){e.preventDefault();if(!e.repeat&&state=='play')dn()}if(e.code=='Escape'&&state=='play')pause()});
addEventListener('keyup',e=>{if(KS.includes(e.code))up()});
$('pz').addEventListener('click',()=>{if(state=='play')pause()});
// ---------- menus ----------
function show(h){ui.innerHTML=h;ui.style.display='flex';$('pz').style.display='none'}
function home(){state='ui';LVD=null;show(`<h1>GEOMETRY RUSH</h1><p>Tap, click or press Space / \u2191 to jump</p><button class="b" onclick="lvls()">\u25B6 Play</button><button class="b" onclick="garage()">Garage</button>`)}
function lvls(){state='ui';show(`<h2>Levels</h2><div class="g">${LV.map((l,i)=>`<button class="b" style="background:hsl(${l[1]},70%,35%)" onclick="play(${i})">${i+1}. ${l[0]}<small>${dl(l[2])} \u00B7 ${sv.bs[i]|0}%</small></button>`).join('')}</div><button class="b" onclick="home()">Back</button>`)}
function play(i){cur=i;LVD=build(i);att=0;state='play';hold=0;ui.style.display='none';$('pz').style.display='block';reset()}
function resume(){state='play';hold=0;ui.style.display='none';$('pz').style.display='block'}
function pause(){state='pause';hold=0;show(`<h2>Paused</h2><button class="b" onclick="resume()">Resume</button><button class="b" onclick="reset();resume()">Restart</button><button class="b" onclick="lvls()">Levels</button>`)}
function done(){state='done';show(`<h2>Level Complete!</h2><p>${LV[cur][0]} \u2014 attempts: ${att}</p>${cur<14?`<button class="b" onclick="play(${cur+1})">Next level</button>`:''}<button class="b" onclick="play(${cur})">Replay</button><button class="b" onclick="lvls()">Levels</button>`)}
function garage(){state='ui';LVD=null;
 const sl=(k,t)=>['H','S','L'].map((n,j)=>`<span>${t} ${n}</span><input type="range" id="${k}${j}" min="0" max="${j?100:360}" value="${sv[k][j]}" oninput="sv.${k}[${j}]=+this.value;pg()">`).join('');
 show(`<h2>Garage</h2><div class="r">${MN.map((n,i)=>`<button class="b${i==gm?' on':''}" onclick="gm=${i};garage()">${n}</button>`).join('')}</div><canvas id="pv" width="110" height="110"></canvas><div class="sk">${[...Array(20)].map((_,i)=>`<canvas width="64" height="64" onclick="sv.sk[gm]=${i};pg()"></canvas>`).join('')}</div><div class="sl">${sl('c1','Main')}${sl('c2','Alt')}</div><button class="b" onclick="home()">Back</button>`);pg()}
function pg(){
 const c1=hsl(sv.c1),c2=hsl(sv.c2);
 ui.querySelectorAll('.sk canvas').forEach((cn,i)=>{const c=cn.getContext('2d');c.clearRect(0,0,64,64);c.save();c.translate(32,32);skin(c,gm,i,c1,c2,34);c.restore();cn.className=sv.sk[gm]==i?'on':''});
 const pv=$('pv');if(pv){const c=pv.getContext('2d');c.clearRect(0,0,110,110);c.save();c.translate(55,55);skin(c,gm,sv.sk[gm],c1,c2,64);c.restore()}
 ['c1','c2'].forEach(k=>{const v=sv[k],h=$(k+'0'),s=$(k+'1'),l=$(k+'2');if(!h)return;
  h.style.background='linear-gradient(90deg,'+[0,60,120,180,240,300,360].map(x=>`hsl(${x},${v[1]}%,${v[2]}%)`).join()+')';
  s.style.background=`linear-gradient(90deg,hsl(${v[0]},0%,${v[2]}%),hsl(${v[0]},100%,${v[2]}%))`;
  l.style.background=`linear-gradient(90deg,#000,hsl(${v[0]},${v[1]}%,50%),#fff)`});save()}
rs();addEventListener('resize',rs);home();requestAnimationFrame(loop);
</script></body></html>
